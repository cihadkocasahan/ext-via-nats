<!doctype html>
<!--
  harness.html — the window ownership marker.

  A window carrying a tab of this page is a window this extension opened.
  `close` reads ownership back from the tab URL in the service worker instead of
  guessing from timestamps, so a window the operator opened in the same profile
  can never be mistaken for ours, and one we opened stays identifiable across a
  restart. Closing this tab by hand simply releases the claim.
-->
<html lang="en"><meta charset="utf-8"><title>ExtViaNats session marker</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 24px; color: #202124; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
  dt { color: #5f6368; }
  dd { margin: 0; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  .run { margin-top: 16px; padding: 8px 10px; background: #f1f3f4; border-radius: 6px; }
</style>
<h1>ExtViaNats session marker</h1>
<p>This tab marks the window as opened by ExtViaNats. You can close it — that
  only releases this window from the owned list, it never touches another window.</p>
<dl>
  <dt>run</dt><dd id="run">—</dd>
  <dt>inst</dt><dd id="inst">—</dd>
  <dt>version</dt><dd id="ver">—</dd>
  <dt>build</dt><dd id="build">—</dd>
  <dt>windows</dt><dd id="wins">—</dd>
</dl>
<div class="run" id="note">waiting for the service worker…</div>
<script src="harness.js"></script>
</html>
