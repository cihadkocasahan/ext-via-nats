<!doctype html>
<!--
  harness.html — the provenance marker and (later) the approval surface.

  A window carrying a tab of this page is a window the relay opened. `close`
  reads ownership back from here instead of guessing from timestamps, so a
  window the operator opened in the same profile can never be mistaken for
  ours, and one we opened stays identifiable across a restart.

  It is also the only surface in this extension where a human can be asked to
  approve something: content scripts do not run on extension pages, so a picker
  has to live here rather than in a tab's DOM.
-->
<meta charset="utf-8">
<title>Agent Relay</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 24px; color: #202124; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
  dt { color: #5f6368; }
  dd { margin: 0; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  .run { margin-top: 16px; padding: 8px 10px; background: #f1f3f4; border-radius: 6px; }
</style>
