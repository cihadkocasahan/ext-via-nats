# Template: replace profile-uuid with the extension's exact inst (shown on its
# settings page). Supply passwords as environment variables to nats-server.
# Add TLS before exposing this to anything but loopback.
port: 4222
websocket { port: 8222, no_tls: true }
authorization {
  users: [
    { user: "controller", password: $EXT_VIA_NATS_CONTROLLER_PASSWORD,
      permissions: {
        publish: ["extvianats.browser.cmd.*", "extvianats.browser.abort.*", "extvianats.browser.info.*", "extvianats.browser.discover"]
        subscribe: ["_INBOX.>", "extvianats.browser.register.*", "extvianats.browser.heartbeat.*", "extvianats.browser.stream.*", "extvianats.browser.invoke.*"]
      }
    },
    { user: "browser-profile", password: $EXT_VIA_NATS_BROWSER_PASSWORD,
      permissions: {
        publish: ["_INBOX.>", "extvianats.browser.register.profile-uuid", "extvianats.browser.heartbeat.profile-uuid", "extvianats.browser.stream.profile-uuid", "extvianats.browser.invoke.profile-uuid"]
        subscribe: ["extvianats.browser.cmd.profile-uuid", "extvianats.browser.abort.profile-uuid", "extvianats.browser.info.profile-uuid", "extvianats.browser.discover"]
      }
    }
  ]
}