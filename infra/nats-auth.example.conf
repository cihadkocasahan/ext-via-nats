# Template: replace profile-uuid with the extension's exact arInst.
# Supply passwords as environment variables to nats-server. Add TLS for WAN.
port: 4222
websocket { port: 8222, no_tls: true }
authorization {
  users: [
    { user: "controller", password: $MESH_CONTROLLER_PASSWORD,
      permissions: {
        publish: ["mesh.browser.cmd.*", "mesh.browser.abort.*", "mesh.browser.info.*", "mesh.browser.discover", "mesh.browser.node.discover", "mesh.browser.node.profiles.*", "mesh.browser.node.launch.*"]
        subscribe: ["_INBOX.>", "mesh.browser.register.*", "mesh.browser.heartbeat.*", "mesh.browser.stream.*", "mesh.browser.invoke.*"]
      }
    },
    { user: "browser-profile", password: $MESH_BROWSER_PASSWORD,
      permissions: {
        publish: ["_INBOX.>", "mesh.browser.register.profile-uuid", "mesh.browser.heartbeat.profile-uuid", "mesh.browser.stream.profile-uuid", "mesh.browser.invoke.profile-uuid"]
        subscribe: ["mesh.browser.cmd.profile-uuid", "mesh.browser.abort.profile-uuid", "mesh.browser.info.profile-uuid", "mesh.browser.discover"]
      }
    },
    { user: "node-workstation", password: $MESH_NODE_PASSWORD,
      permissions: {
        publish: ["_INBOX.>"]
        subscribe: ["mesh.browser.node.discover", "mesh.browser.node.profiles.workstation", "mesh.browser.node.launch.workstation"]
      }
    }
  ]
}
